<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小丑牌选种器</title>
<style>
  @font-face{
    font-family:"m6x11";
    src:url("image/m6x11plus.ttf") format("truetype");
    font-display:swap;
  }
  @font-face{
    font-family:"balatro-cn";
    src:url("image/NotoSansSC-Bold.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --felt:#1d4a45;
    --panel:#3f4d4c;
    --panel-lite:#4d5c5a;
    --ink:#131f1e;
    --chip:#fdf6ec;
    --red:#fe5f55;      --red-dk:#c03a31;
    --blue:#009dff;     --blue-dk:#0068ad;
    --gold:#ffa200;     --gold-dk:#c06f00;
    --green:#4bc292;    --green-dk:#2c8560;
    --dim:#9cb0ad;
    --stroke:#e2e0d4;   /* 面板外描边 */
    /* 像素切角：4px 台阶 */
    --cut:polygon(
      0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
    );
    --cut-sm:polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:16px 12px 70px;
    background:var(--felt);
    color:var(--chip);
    font-family:"m6x11","balatro-cn",ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
    font-size:18px;line-height:1.45;
    image-rendering:pixelated;
  }
  .wrap{max-width:640px;margin:0 auto}

  /* ---- 标题 ---- */
  .title{text-align:center;margin:4px 0 2px}
  .title img{width:min(78%,330px);height:auto;image-rendering:pixelated}
  .sub{color:var(--dim);font-size:15px;text-align:center;margin:6px 0 20px}

  /* ---- 面板：外层描边 + 内层底色，都用切角 ---- */
  fieldset{
    border:none;margin:0 0 20px;padding:0;
    background:var(--stroke);
    clip-path:var(--cut);
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.45));
  }
  .fs-in{
    margin:3px;padding:16px 14px 18px;
    background:var(--panel);
    clip-path:var(--cut);
  }
  legend{display:none}
  .cap{
    display:inline-block;margin:0 0 10px;padding:2px 12px 3px;
    font-size:16px;color:var(--ink);background:var(--gold);
    clip-path:var(--cut-sm);
    box-shadow:0 3px 0 var(--gold-dk);
  }

  label{display:block;font-size:14px;color:var(--dim);margin:12px 0 5px}
  input,select{
    width:100%;padding:9px 11px;border:none;
    background:var(--ink);color:var(--chip);
    font:inherit;font-size:17px;
    clip-path:var(--cut-sm);
  }
  input:focus,select:focus{outline:none;background:#0a1413}
  input::placeholder{color:#5d706e}
  .row{display:flex;gap:10px}.row>div{flex:1;min-width:0}

  /* ---- 按钮：切角 + 厚下沿 ---- */
  button{
    width:100%;margin-top:16px;padding:10px;
    border:none;cursor:pointer;
    background:var(--red);color:var(--chip);
    font:inherit;font-size:19px;
    clip-path:var(--cut-sm);
    box-shadow:0 5px 0 var(--red-dk);
    transition:transform .04s,box-shadow .04s;
  }
  button:active{transform:translateY(5px);box-shadow:0 0 0 var(--red-dk)}
  button.ghost{background:var(--blue);box-shadow:0 5px 0 var(--blue-dk);font-size:16px;padding:8px}
  button.ghost:active{box-shadow:0 0 0 var(--blue-dk)}
  button.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-dk)}
  button.gold:active{box-shadow:0 0 0 var(--gold-dk)}

  /* ---- 说明气泡 ---- */
  .i{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;margin-left:6px;vertical-align:0px;position:relative;top:1px;
    background:var(--dim);color:var(--panel);
    font-size:13px;cursor:pointer;flex:none;
    clip-path:polygon(
      0 6px, 2px 6px, 2px 4px, 4px 4px, 4px 2px, 6px 2px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 2px, calc(100% - 4px) 2px, calc(100% - 4px) 4px,
      calc(100% - 2px) 4px, calc(100% - 2px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 2px) calc(100% - 6px), calc(100% - 2px) calc(100% - 4px),
      calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) calc(100% - 2px),
      calc(100% - 6px) calc(100% - 2px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 2px), 4px calc(100% - 2px), 4px calc(100% - 4px),
      2px calc(100% - 4px), 2px calc(100% - 6px), 0 calc(100% - 6px));
  }
  .i:active{background:var(--gold)}
  #tip{
    display:none;position:fixed;z-index:200;left:50%;bottom:22px;
    transform:translateX(-50%);width:min(90vw,430px);
    background:var(--stroke);clip-path:var(--cut);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.55);
  }
  #tip .tip-in{
    margin:3px;padding:15px 16px;background:var(--panel);
    clip-path:var(--cut);font-size:16px;line-height:1.65;color:var(--chip);
  }
  #tip b{color:var(--gold)}

  /* ---- 条件组 ---- */
  .wantgroup{
    background:var(--panel-lite);clip-path:var(--cut-sm);
    padding:9px 9px 6px;margin-top:10px;
  }
  .want{display:grid;grid-template-columns:1fr 84px 52px 30px;gap:6px;align-items:center;margin-top:5px}
  .want:first-child{margin-top:0}
  .want select,.want input{padding:7px 6px;font-size:15px}
  .want .del{
    width:30px;margin:0;padding:6px 0;font-size:17px;
    background:transparent;color:var(--dim);box-shadow:none;clip-path:none;
  }
  .want .del:active{transform:none;color:var(--red)}
  .or-row{margin-top:6px}
  .or-row button{width:auto;margin:0;padding:3px 12px;font-size:14px;
    background:var(--green);box-shadow:0 4px 0 var(--green-dk)}
  .or-row button:active{box-shadow:0 0 0 var(--green-dk)}
  .edition-needs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
  .edition-needs label{margin:0;text-align:center;color:var(--chip);font-size:14px}
  .edition-needs input{margin-top:4px;padding:7px 4px;text-align:center}
  @media(max-width:430px){.edition-needs{grid-template-columns:repeat(2,1fr)}}

  .face{
    display:flex;align-items:center;gap:7px;padding:4px 8px;
    background:var(--ink);cursor:pointer;min-height:44px;overflow:hidden;
    clip-path:var(--cut-sm);
  }
  .fname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;flex:none;overflow:hidden;position:relative;vertical-align:middle}
  .chip img{display:block;image-rendering:pixelated;max-width:none}

  /* ---- 结果 ---- */
  .hit{
    padding:11px 13px;margin-top:10px;
    background:var(--panel-lite);clip-path:var(--cut-sm);
  }
  .hit{position:relative}
  .hit .seed{font-size:25px;color:var(--gold);letter-spacing:.15em;cursor:pointer}
  .hit .cp{
    position:absolute;top:10px;right:10px;width:auto;margin:0;
    padding:3px 11px;font-size:14px;
    background:var(--felt);box-shadow:0 3px 0 #12302d;
  }
  .hit .cp:active{box-shadow:0 0 0 #12302d}
  .tools{display:flex;gap:8px;margin-top:12px}
  .tools button{margin:0;flex:1;font-size:15px;padding:7px}
  .odds{
    margin-top:14px;padding:10px 12px;
    background:var(--panel-lite);clip-path:var(--cut-sm);
    font-size:15px;line-height:1.7;
  }
  .odds .big{font-size:19px;color:var(--gold)}
  .odds .lv{display:inline-block;padding:0 9px;margin-right:7px;font-size:14px;
    color:var(--ink);clip-path:var(--cut-sm)}
  .lv-easy{background:var(--green)}
  .lv-mid{background:var(--gold)}
  .lv-hard{background:var(--red);color:var(--chip)}
  .hit .where{font-size:15px;margin-top:5px;line-height:1.95}
  .ed{color:var(--red)}
  .stat{font-size:15px;color:var(--dim);margin-top:14px;line-height:1.8}
  .stat b{color:var(--gold)}
  .preview{font-size:15px;line-height:1.95}
  .preview .a{color:var(--gold)}
  .preview .o{color:var(--dim)}

  /* ---- 陈列柜 ---- */
  #picker{display:none;position:fixed;inset:0;z-index:99;
    background:rgba(19,31,30,.97);flex-direction:column;padding:12px}
  #picker .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  #picker .bar input{flex:1;margin:0;background:var(--panel)}
  #picker .bar button{width:auto;margin:0;padding:9px 16px;font-size:16px}
  #pgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pgroup{
    color:var(--ink);font-size:15px;margin:14px 0 8px;padding:1px 12px 2px;
    background:var(--gold);display:inline-block;
    clip-path:var(--cut-sm);box-shadow:0 3px 0 var(--gold-dk);
  }
  .prow{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .pcard{
    width:auto;margin:0;padding:6px 2px 7px;
    background:var(--panel);clip-path:var(--cut-sm);
    box-shadow:0 4px 0 var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .pcard:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  .pname{font-size:13px;color:var(--dim);line-height:1.25;text-align:center;word-break:break-all}

  button,.face,.pcard,.i{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button:focus{outline:none}
</style>
</head>
<body>
<div class="wrap">
<div class="title"><img src="image/balatro-logo.png" alt="BALATRO"></div>
<p class="sub">小丑牌种子生成器 ・ 按条件寻找称心的种子</p>

<fieldset><div class="fs-in">
  <div class="cap">筛选条件<span class="i" data-tip="cond" style="background:var(--ink);color:var(--gold);margin-left:8px">i</span></div>
  <div id="wants"></div>
  <button class="ghost" id="add">+ 增加条件</button>

  <div style="margin-top:16px;color:var(--chip);font-size:15px">
    <div style="display:flex;align-items:center;gap:8px">这些条件合计至少包含<span class="i" data-tip="edtotal">i</span></div>
    <div class="edition-needs">
      <label>负片<input id="need-neg" type="number" min="0" value="0"></label>
      <label>多彩<input id="need-poly" type="number" min="0" value="0"></label>
      <label>全息<input id="need-holo" type="number" min="0" value="0"></label>
      <label>闪箔<input id="need-foil" type="number" min="0" value="0"></label>
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    <div>
      <label>每底注看几个商店位<span class="i" data-tip="shop">i</span></label>
      <input id="slots" type="number" value="6">
    </div>
    <div>
      <label>找到几个就停<span class="i" data-tip="stop">i</span></label>
      <input id="found" type="number" value="5">
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--chip);font-size:16px">
    <label style="display:flex;align-items:center;gap:8px;margin:0;color:inherit;font-size:inherit;cursor:pointer">
      <input type="checkbox" id="packs" checked style="width:auto;margin:0;clip-path:none"> 连卡包里的一起搜
    </label>
    <span class="i" data-tip="packs">i</span>
  </div>
  <div style="margin-top:12px;color:var(--chip);font-size:15px">
    <div style="display:flex;align-items:center;gap:8px">已经满足的条件（对应小丑不再锁）<span class="i" data-tip="gold">i</span></div>
    <div id="unlocks" style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px"></div>
  </div>

  <label>从哪个种子开始数<span class="i" data-tip="from">i</span></label>
  <input id="from" placeholder="留空＝随机找个地方开始" autocapitalize="characters" spellcheck="false">

  <button class="gold" id="est">先估一下难度</button>
  <div class="odds" id="odds" style="display:none"></div>
  <button id="go">开始寻找</button>
  <button class="ghost" id="stop" style="display:none">结束搜寻</button>
  <div class="stat" id="stat"></div>
</div></fieldset>

<fieldset><div class="fs-in">
  <div class="cap">捞到的种子</div>
  <div id="hits" style="font-size:15px;color:var(--dim)">还没开始。</div>
  <div class="tools" id="tools" style="display:none">
    <button class="ghost" id="copyall">复制全部</button>
    <button class="ghost" id="clearall">清空列表</button>
  </div>
</div></fieldset>

<fieldset><div class="fs-in">
  <div class="cap">简易种子分析</div>
  <input id="one" placeholder="输入种子" autocapitalize="characters" spellcheck="false">
  <button class="ghost" id="peek" style="margin-top:12px">查询种子详情</button>
  <div class="preview" id="pv" style="margin-top:12px"></div>
</div></fieldset>

</div>

<div id="picker">
  <div class="bar">
    <input id="psearch" placeholder="输入小丑牌名称…" autocomplete="off">
    <button id="pclose">关闭</button>
  </div>
  <div id="pgrid"></div>
</div>

<div id="tip"><div class="tip-in">
  <div id="tiptext"></div>
  <button class="gold" id="tipclose">知道了</button>
</div></div>

<script type="text/plain" id="engine-src">
const POOLS = {
 1: ["Joker","Greedy Joker","Lusty Joker","Wrathful Joker","Gluttonous Joker","Jolly Joker","Zany Joker","Mad Joker","Crazy Joker","Droll Joker","Sly Joker","Wily Joker","Clever Joker","Devious Joker","Crafty Joker","Half Joker","Credit Card","Banner","Mystic Summit"," 8 Ball","Misprint","Raised Fist","Chaos the Clown","Scary Face","Abstract Joker","Delayed Gratification","Gros Michel","Even Steven","Odd Todd","Scholar","Business Card","Supernova","Ride the Bus","Egg","Runner","Ice Cream","Splash","Blue Joker","Faceless Joker","Green Joker","Superposition","To Do List","Cavendish","Red Card","Square Joker","Riff raff","Photograph","Reserved Parking","Mail In Rebate","Hallucination","Fortune Teller","Juggler","Drunkard","Golden Joker","Popcorn","Walkie Talkie","Smiley Face","Golden Ticket","Swashbuckler","Hanging Chad","Shoot the Moon"],
 2: ["Joker Stencil","Four Fingers","Mime","Ceremonial Dagger","Marble Joker","Loyalty Card","Dusk","Fibonacci","Steel Joker","Hack","Pareidolia","Space Joker","Burglar","Blackboard","Sixth Sense","Constellation","Hiker","Card Sharp","Madness","Seance","Vampire","Shortcut","Hologram","Cloud 9","Rocket","Midas Mask","Luchador","Gift Card","Turtle Bean","Erosion","To the Moon","Stone Joker","Lucky Cat","Bull","Diet Cola","Trading Card","Flash Card","Spare Trousers","Ramen","Seltzer","Castle","Mr Bones","Acrobat","Sock and Buskin","Troubadour","Certificate","Smeared Joker","Throwback","Rough Gem","Bloodstone","Arrowhead","Onyx Agate","Glass Joker","Showman","Flower Pot","Merry Andy","Oops All 6s","The Idol","Seeing Double","Matador","Satellite","Cartomancer","Astronomer","Bootstraps"],
 3: ["DNA","Vagabond","Baron","Obelisk","Baseball Card","Ancient Joker","Campfire","Blueprint","Wee Joker","Hit the Road","The Duo","The Trio","The Family","The Order","The Tribe","Stuntman","Invisible Joker","Brainstorm","Drivers License","Burnt Joker"],
 4: ["Canio","Triboulet","Yorick","Chicot","Perkeo"]
};
/* ===== 引擎（32 位手写版，逻辑与对拍通过的 BigInt 版完全一致） ===== */
function pseudohash(str){
  let num=1;
  for(let i=str.length;i>=1;i--)
    num=((1.1239285023/num)*str.charCodeAt(i-1)*Math.PI+Math.PI*i)%1;
  return num;
}
/* 与 parseFloat(x.toFixed(13)) 逐位相同：x*1e13 的误差不到 0.001，
   只有小数部分贴着 .5 时取整方向才可能不同，那时退回字符串版 */
function round13(x){
  const y=x*1e13, f=y-Math.floor(y);
  if(f>0.49&&f<0.51) return parseFloat(x.toFixed(13));
  return Math.round(y)/1e13;
}
const _b=new ArrayBuffer(8),_f=new Float64Array(_b),_u=new Uint32Array(_b);

class LuaRandom{
  constructor(){this.h0=this.l0=this.h1=this.l1=this.h2=this.l2=this.h3=this.l3=0;this._h=this._l=0;}
  /* 四路 Tausworthe 按常数展开，64 位拆成 hi/lo 两个 32 位 */
  step(){
    let zh,zl,ah,al,bh,bl,h,l;
    /* 第 0 路：k=63 q=31 s=18 */
    zh=this.h0;zl=this.l0;
    ah=((zh<<31)|(zl>>>1))^zh;al=(zl<<31)^zl;
    al=ah>>>13;ah=0;
    bl=zl&4294967294;
    bh=(zh<<18)|(bl>>>14);bl=bl<<18;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h0=zh;this.l0=zl;
    h=zh;l=zl;
    /* 第 1 路：k=58 q=19 s=28 */
    zh=this.h1;zl=this.l1;
    ah=((zh<<19)|(zl>>>13))^zh;al=(zl<<19)^zl;
    al=(al>>>30)|(ah<<2);ah=ah>>>30;
    bl=zl&4294967232;
    bh=(zh<<28)|(bl>>>4);bl=bl<<28;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h1=zh;this.l1=zl;
    h^=zh;l^=zl;
    /* 第 2 路：k=55 q=24 s=7 */
    zh=this.h2;zl=this.l2;
    ah=((zh<<24)|(zl>>>8))^zh;al=(zl<<24)^zl;
    al=ah>>>16;ah=0;
    bl=zl&4294966784;
    bh=(zh<<7)|(bl>>>25);bl=bl<<7;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h2=zh;this.l2=zl;
    h^=zh;l^=zl;
    /* 第 3 路：k=47 q=21 s=8 */
    zh=this.h3;zl=this.l3;
    ah=((zh<<21)|(zl>>>11))^zh;al=(zl<<21)^zl;
    al=ah>>>7;ah=0;
    bl=zl&4294836224;
    bh=(zh<<8)|(bl>>>24);bl=bl<<8;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h3=zh;this.l3=zl;
    h^=zh;l^=zl;
    this._h=h>>>0;this._l=l>>>0;
  }
  seed(d){
    /* 原来的循环展开：r=0x11090601 每轮取最低字节当位移 */
    d=d*3.14159265358979323846+2.7182818284590452354;
    _f[0]=d;this.h0=_u[1];this.l0=_u[0];if(this.l0<2)this.l0=(this.l0+2)>>>0;
    d=d*3.14159265358979323846+2.7182818284590452354;
    _f[0]=d;this.h1=_u[1];this.l1=_u[0];if(this.l1<64)this.l1=(this.l1+64)>>>0;
    d=d*3.14159265358979323846+2.7182818284590452354;
    _f[0]=d;this.h2=_u[1];this.l2=_u[0];if(this.l2<512)this.l2=(this.l2+512)>>>0;
    d=d*3.14159265358979323846+2.7182818284590452354;
    _f[0]=d;this.h3=_u[1];this.l3=_u[0];if(this.l3<131072)this.l3=(this.l3+131072)>>>0;
    for(let i=0;i<10;i++)this.step();
  }
  double(){
    this.step();
    _u[1]=((this._h&0x000FFFFF)|0x3FF00000)>>>0;
    _u[0]=this._l;
    return _f[0]-1.0;
  }
  int(n){return Math.floor(this.double()*n)+1;}
}
/* key 跟种子无关：每个 key 发一个固定编号，随机状态按编号存进数组。
   同一个 key 不管走字符串还是走编号，读写的都是同一格，结果不变 */
const KEY_ID=new Map(),KEY_STR=[],KEY_RES=[];
function kid(str){
  let id=KEY_ID.get(str);
  if(id===undefined){id=KEY_STR.length;KEY_ID.set(str,id);KEY_STR.push(str);KEY_RES.push(null);}
  return id;
}
function resampleId(id,n){
  let r=KEY_RES[id];if(!r)r=KEY_RES[id]=[];
  let x=r[n];if(x===undefined)x=r[n]=kid(KEY_STR[id]+"_resample"+n);
  return x;
}

class Run{
  constructor(s){
    this.rng=new LuaRandom();
    this.sv=new Float64Array(256);this.sg=new Float64Array(256);   /* 状态值 / 属于第几次 reset */
    this.hv=new Float64Array(64);this.hg=new Float64Array(64);     /* 种子那段哈希，按 key 长度缓存 */
    this.g=0;this.reset(s);
  }
  reset(s){this.seedStr=s;this.hashed=pseudohash(s);this.g++;return this;}
  /* pseudohash(key+seed) 从末尾往前算，所以种子那几个字符先算，
     中间结果只跟 key 的长度有关，同一个种子里可以共用 */
  seedPart(klen){
    if(klen>=this.hv.length){const n=klen*2+1;const a=new Float64Array(n),b=new Float64Array(n);
      a.set(this.hv);b.set(this.hg);this.hv=a;this.hg=b;}
    if(this.hg[klen]===this.g)return this.hv[klen];
    const s=this.seedStr,L=klen+s.length;let num=1;
    for(let i=L;i>klen;i--)num=((1.1239285023/num)*s.charCodeAt(i-klen-1)*Math.PI+Math.PI*i)%1;
    this.hv[klen]=num;this.hg[klen]=this.g;return num;
  }
  pseudoseedId(id){
    if(id>=this.sv.length){let n=this.sv.length;while(n<=id)n*=2;
      const a=new Float64Array(n),b=new Float64Array(n);a.set(this.sv);b.set(this.sg);this.sv=a;this.sg=b;}
    let v;
    if(this.sg[id]===this.g)v=this.sv[id];
    else{
      const k=KEY_STR[id];let num=this.seedPart(k.length);
      for(let i=k.length;i>=1;i--)num=((1.1239285023/num)*k.charCodeAt(i-1)*Math.PI+Math.PI*i)%1;
      v=num;
    }
    v=Math.abs(round13((2.134453429141+v*1.72431234)%1));
    this.sv[id]=v;this.sg[id]=this.g;
    return (v+this.hashed)/2;
  }
  pseudoseed(key){return this.pseudoseedId(kid(key));}
  randId(id){this.rng.seed(this.pseudoseedId(id));return this.rng.double();}
  rand(key){return this.randId(kid(key));}
  pick(key,list){this.rng.seed(this.pseudoseed(key));return list[this.rng.int(list.length)-1];}
}

/* ========== 商店 ========== */
const EDITIONS=[[0.997,"负片"],[0.994,"多彩"],[0.98,"全息"],[0.96,"闪箔"]];

function jokerEdition(run,src,ante){
  const p=run.rand("edi"+src+ante);
  for(const [t,name] of EDITIONS) if(p>t) return name;
  return null;
}

/* 开局就锁住的牌：源码里它们在池子里占着位子（UNAVAILABLE），抽到了要重抽 */
/* 金票/钢铁/石头/幸运猫/玻璃 要牌组里有对应增强牌；卡文迪什要大麦克香蕉灭绝过 */
const GATED_JOKERS=new Set(["Golden Ticket","Steel Joker","Stone Joker","Lucky Cat","Glass Joker","Cavendish"]);
/* 实战里条件达成后就解锁：传进来的是已解锁的小丑名字。
   大麦克香蕉灭绝之后卡文迪什解锁，大麦克香蕉自己反而再也不会出现 */
const GATE_BASE=["Golden Ticket","Steel Joker","Stone Joker","Lucky Cat","Glass Joker","Cavendish"];
function setUnlocks(u){
  u=u||[];GATED_JOKERS.clear();
  for(const j of GATE_BASE) if(!u.includes(j)) GATED_JOKERS.add(j);
  if(u.includes("Cavendish")) GATED_JOKERS.add("Gros Michel");
}
/* 行星X/谷神星/阋神星 要先打出过对应牌型 */
const GATED_PLANETS=new Set(["Planet X","Ceres","Eris"]);

/* 商店第 n 个位置卖什么 */
function shopSlot(run,ante){
  const t=run.rand("cdt"+ante)*28;
  /* 商店的消耗牌不 soulable（create_card 第六个参数没传），永远不会翻灵魂牌 */
  if(t>=20) return {type:t<24?"塔罗牌":"星球牌"};
  const r=run.rand("rarity"+ante+"sho");
  const rarity=r>0.95?3:(r>0.7?2:1);
  const name=run.choice("Joker"+rarity+"sho"+ante,POOLS[rarity],GATED_JOKERS);
  return {type:"joker",name,rarity,edition:jokerEdition(run,"sho",ante)};
}


/* ===== 消耗牌池 ===== */
const TAROTS=["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Justice","The Hermit","The Wheel of Fortune","Strength","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
const PLANETS=["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto","Planet X","Ceres","Eris"];
const SPECTRALS=["Familiar","Grim","Incantation","Talisman","Aura","Wraith","Sigil","Ouija","Ectoplasm","Immolate","Ankh","Deja Vu","Hex","Trance","Medium","Cryptid","RETRY","RETRY"];

/* 卡包权重（第一项是"这个位子没有包"） */
const PACKS=[["RETRY",22.42],["Arcana Pack",4],["Jumbo Arcana Pack",2],["Mega Arcana Pack",0.5],
["Celestial Pack",4],["Jumbo Celestial Pack",2],["Mega Celestial Pack",0.5],
["Standard Pack",4],["Jumbo Standard Pack",2],["Mega Standard Pack",0.5],
["Buffoon Pack",1.2],["Jumbo Buffoon Pack",0.6],["Mega Buffoon Pack",0.15],
["Spectral Pack",0.6],["Jumbo Spectral Pack",0.3],["Mega Spectral Pack",0.07]];

/* 加权抽签：拿第一项的权重当总量，往后累加 */
Run.prototype.weighted=function(key,items){return this.weightedId(kid(key),items);};
Run.prototype.weightedId=function(id,items){
  this.rng.seed(this.pseudoseedId(id));
  const poll=this.rng.double()*items[0][1];
  let idx=1,w=0;
  while(w<poll){w+=items[idx][1];idx++;}
  return items[idx-1][0];
};

/* 带锁的抽取：抽到锁上的就 _resample2、_resample3 重抽 */
Run.prototype.choice=function(key,items,locked){return this.choiceId(kid(key),items,locked);};
Run.prototype.choiceId=function(id,items,locked){
  this.rng.seed(this.pseudoseedId(id));
  let it=items[this.rng.int(items.length)-1];
  if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  let n=2;
  while(n<=1000){
    this.rng.seed(this.pseudoseedId(resampleId(id,n)));
    it=items[this.rng.int(items.length)-1];
    n++;
    if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  }
  return it;
};

/* 包的种类 → 里面几张、能选几张 */
const _PINFO=Object.create(null);
function packInfo(p){return _PINFO[p]||(_PINFO[p]=packInfo0(p));}
function packInfo0(p){
  /* 小丑包和幻灵包共用小尺寸：普通 2 张、大 4 张、超大 4 张选 2 */
  const small=p.includes("Buffoon")||p.includes("Spectral");
  if(p.startsWith("Mega "))  return {kind:p.slice(5), size:small?4:5, pick:2};
  if(p.startsWith("Jumbo ")) return {kind:p.slice(6), size:small?4:5, pick:1};
  return {kind:p, size:small?2:3, pick:1};
}

const PACK_CN={"Arcana Pack":"奇术包","Celestial Pack":"天体包","Standard Pack":"标准包",
               "Buffoon Pack":"小丑包","Spectral Pack":"幻灵包"};
function packName(p){
  const i=packInfo(p);
  return (p.startsWith("Mega ")?"超大":p.startsWith("Jumbo ")?"大":"")+(PACK_CN[i.kind]||i.kind);
}

/* 包里装了什么 */
function openPack(run,p,ante){
  const {kind,size}=packInfo(p);
  const locked=new Set(kind==="Celestial Pack"?GATED_PLANETS:GATED_JOKERS),out=[];
  let soulDone=false,holeDone=false;
  for(let i=0;i<size;i++){
    let c;
    if(kind==="Buffoon Pack"){
      const r=run.rand("rarity"+ante+"buf");
      const rarity=r>0.95?3:(r>0.7?2:1);
      const name=run.choice("Joker"+rarity+"buf"+ante,POOLS[rarity],locked);
      c={type:"joker",name,rarity,edition:jokerEdition(run,"buf",ante)};
    } else if(kind==="Arcana Pack"){
      /* 同一个包里灵魂牌只出一张，出过之后连掷都不掷了 */
      if(!soulDone&&run.rand("soul_Tarot"+ante)>0.997){c={type:"soul"};soulDone=true;}
      else c={type:"tarot",name:run.choice("Tarot"+"ar1"+ante,TAROTS,locked)};
    } else if(kind==="Spectral Pack"){
      /* 源码里这是两个独立的 if，两次都要掷，后者盖过前者 */
      const isSoul=!soulDone&&run.rand("soul_Spectral"+ante)>0.997;
      const isHole=!holeDone&&run.rand("soul_Spectral"+ante)>0.997;
      if(isHole){c={type:"spectral",name:"Black Hole"};holeDone=true;}
      else if(isSoul){c={type:"soul"};soulDone=true;}
      else c={type:"spectral",name:run.choice("Spectral"+"spe"+ante,SPECTRALS,locked)};
    } else if(kind==="Celestial Pack"){
      c={type:"planet",name:run.choice("Planet"+"pl1"+ante,PLANETS,locked)};
    } else { c={type:"card",name:"扑克牌"}; }   /* 标准包暂不细分 */
    if(c.type==="soul"){
      /* 灵魂牌造出的传奇走自己的通道：source 是 "sou" */
      c={type:"joker",name:run.choice("Joker4",POOLS[4]),rarity:4,
         edition:jokerEdition(run,"sou",ante),soul:true};
    }
    if(c.name)locked.add(c.name);
    out.push(c);
  }
  return out;
}

/* 打完 Boss 底注就 +1，那次商店算下一底注头上：
   所以底注 1 只有小盲、大盲两次商店（4 个包），之后每底注 3 次（6 个包） */
function antePacks(run,ante,state){
  const res=[];
  const n=(ante===1)?4:6;
  for(let i=0;i<n;i++){
    let p;
    if(ante<=2&&!state.firstPack){ state.firstPack=true; p="Buffoon Pack"; }
    else p=run.weighted("shop_pack"+ante,PACKS);
    if(p==="RETRY")continue;
    res.push({pack:p,cards:openPack(run,p,ante)});
  }
  return res;
}

const _shared=new Run("AAAAAAAA");
function scanSeed(seed,antes,slots,withPacks){
  const run=_shared.reset(seed);
  const found=[];const st={};
  for(let a=1;a<=antes;a++){
    for(let s=1;s<=slots;s++){
      const it=shopSlot(run,a);
      if(it.type==="joker")found.push({name:it.name,ante:a,slot:s,
        edition:it.edition,soul:it.soul,from:"商店第 "+s+" 位"});
    }
    if(withPacks){
      for(const p of antePacks(run,a,st))
        for(const c of p.cards)
          if(c.type==="joker")found.push({name:c.name,ante:a,slot:0,
            edition:c.edition,soul:c.soul,from:packName(p.pack)});
    }
  }
  return found;
}
const CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
const TOTAL=Math.pow(35,8);
function seedFromIndex(n){let s="";for(let i=0;i<8;i++){s=CHARS[n%35]+s;n=Math.floor(n/35);}return s;}
function indexFromSeed(str){
  const s=str.toUpperCase().padStart(8,"A");let n=0;
  for(let i=0;i<8;i++){const p=CHARS.indexOf(s[i]);n=n*35+(p<0?0:p);}
  return n;
}
function matchSeed(seed,groups,slots,maxAnte,withPacks,editionNeeds){
  const got=scanSeed(seed,maxAnte,slots,withPacks);
  const out=new Array(groups.length);
  const used=new Set();
  const needed=editionNeeds||{};
  const counts={};
  const needKeys=Object.keys(needed).filter(k=>needed[k]>0);
  const search=i=>{
    if(i===groups.length)
      return needKeys.every(k=>(counts[k]||0)>=needed[k]);
    const deficit=needKeys.reduce((n,k)=>n+Math.max(0,needed[k]-(counts[k]||0)),0);
    if(deficit>groups.length-i)return false;
    const candidates=[];const seen=new Set();
    for(const w of groups[i]) for(let gi=0;gi<got.length;gi++){
      const g=got[gi];
      if(!seen.has(gi)&&!used.has(gi)&&g.name===w.name&&g.ante<=w.ante&&(!w.ed||g.edition===w.ed)){
        seen.add(gi);candidates.push([gi,g]);
      }
    }
    candidates.sort((a,b)=>Math.max(0,(needed[b[1].edition]||0)-(counts[b[1].edition]||0))-
      Math.max(0,(needed[a[1].edition]||0)-(counts[a[1].edition]||0)));
    for(const [gi,g] of candidates){
      used.add(gi);out[i]=g;
      if(g.edition)counts[g.edition]=(counts[g.edition]||0)+1;
      if(search(i+1))return true;
      if(g.edition)counts[g.edition]--;
      used.delete(gi);
    }
    return false;
  };
  return search(0)?out:null;
}

/* ===== 快速通道：只算条件用得上的东西，用来快速排除 ===== */
const RAR_OF={};
for(const r of [1,2,3,4]) for(const j of POOLS[r]) RAR_OF[j]=r;

function makePlan(groups,slots,maxAnte,withPacks,editionNeeds){
  const needRar=new Set();
  let needLeg=false;
  const allWants=[];
  for(const grp of groups) for(const w of grp){
    allWants.push(w);
    const r=RAR_OF[w.name];
    if(r===4)needLeg=true; else needRar.add(r);
  }
  const deadline={};
  for(const grp of groups){
    const maxA=Math.max(...grp.map(w=>w.ante));
    for(const w of grp) deadline[maxA]=(deadline[maxA]||[]);
  }
  const gmax=groups.map(g=>Math.max(...g.map(w=>w.ante)));
  /* 整组都是传奇的，可以在第一遍就判 */
  const legGroups=[];let legMax=0;
  groups.forEach((g,i)=>{
    if(g.every(w=>RAR_OF[w.name]===4))legGroups.push(i);
    for(const w of g) if(RAR_OF[w.name]===4) legMax=Math.max(legMax,w.ante);
  });
  return {needRar,needLeg,groups,gmax,legGroups,legMax,deadline,slots,maxAnte,withPacks,editionNeeds};
}

/* 每个底注用到的 key 编号，第一次用到时登记 */
const _FK=[];
function fk(a){
  let k=_FK[a];if(k)return k;
  return _FK[a]={cdt:kid("cdt"+a),rSho:kid("rarity"+a+"sho"),rBuf:kid("rarity"+a+"buf"),
    jSho:[0,kid("Joker1sho"+a),kid("Joker2sho"+a),kid("Joker3sho"+a)],
    jBuf:[0,kid("Joker1buf"+a),kid("Joker2buf"+a),kid("Joker3buf"+a)],
    pack:kid("shop_pack"+a),sT:kid("soul_Tarot"+a),sS:kid("soul_Spectral"+a)};
}
const K_J4=kid("Joker4");

/* 返回 true = 这个种子有戏，值得完整算一遍。
   分两遍：先只看灵魂牌（便宜，而且大多数种子在这里就被淘汰），再看普通到稀有小丑。
   每条随机流只认自己的 key，不同 key 谁先算谁后算不影响结果；
   两遍都要用的卡包种类只掷一次，存起来给第二遍用。 */
const _PK=[];
function fastScan(seed,plan){
  const run=_shared.reset(seed);
  const found=new Map();   /* 名字 → 最早出现的底注 */
  const {needRar,needLeg,slots,maxAnte,withPacks,groups,gmax,legGroups,legMax}=plan;
  let packDone=0;
  const packsOf=a=>{       /* 第 a 底注的卡包，按底注顺序掷，掷过就记住 */
    while(packDone<a){
      const b=++packDone,K=fk(b),arr=_PK[b]||(_PK[b]=[]);arr.length=0;
      for(let i=0,np=(b===1?4:6);i<np;i++)
        arr.push(b===1&&i===0?"Buffoon Pack":run.weightedId(K.pack,PACKS));
    }
    return _PK[a];
  };
  const groupOk=g=>{
    for(const w of groups[g]){const fa=found.get(w.name);if(fa!==undefined&&fa<=w.ante)return true;}
    return false;
  };

  /* 第一遍：灵魂牌 → 传奇 */
  if(needLeg&&withPacks){
    for(let a=1;a<=legMax;a++){
      const K=fk(a);
      for(const p of packsOf(a)){
        const info=packInfo(p);
        if(info.kind==="Arcana Pack"){
          for(let k=0;k<info.size;k++)
            if(run.randId(K.sT)>0.997){
              const n=run.choiceId(K_J4,POOLS[4]);
              if(!found.has(n))found.set(n,a);
              break;
            }
        } else if(info.kind==="Spectral Pack"){
          let sd=false,hd=false;
          for(let k=0;k<info.size;k++){
            const isSoul=!sd&&run.randId(K.sS)>0.997;
            const isHole=!hd&&run.randId(K.sS)>0.997;
            if(isHole)hd=true;
            else if(isSoul){sd=true;const n=run.choiceId(K_J4,POOLS[4]);if(!found.has(n))found.set(n,a);}
          }
        }
      }
      /* 纯传奇的组过了期限还没中，直接扔 */
      for(const g of legGroups) if(a>=gmax[g]&&!groupOk(g)) return false;
    }
  }
  for(const g of legGroups) if(!groupOk(g)) return false;

  /* 第二遍：商店和小丑包里的普通/罕见/稀有 */
  for(let a=1;a<=maxAnte;a++){
    if(needRar.size){
      const K=fk(a);
      for(let s=1;s<=slots;s++){
        const t=run.randId(K.cdt)*28;
        if(t<20){
          const r=run.randId(K.rSho);
          const rar=r>0.95?3:(r>0.7?2:1);
          if(needRar.has(rar)){
            const n=run.choiceId(K.jSho[rar],POOLS[rar],GATED_JOKERS);
            if(!found.has(n))found.set(n,a);
          }
        }                                         /* 商店的塔罗/星球不会翻灵魂牌 */
      }
      if(withPacks){
        let locked=null;
        for(const p of packsOf(a)){
          const info=packInfo(p);
          if(info.kind!=="Buffoon Pack")continue;
          locked=new Set(GATED_JOKERS);
          for(let k=0;k<info.size;k++){
            const r=run.randId(K.rBuf);
            const rar=r>0.95?3:(r>0.7?2:1);
            const n=run.choiceId(K.jBuf[rar],POOLS[rar],locked);
            locked.add(n);
            if(needRar.has(rar)&&!found.has(n))found.set(n,a);
          }
        }
      }
    }
    /* 提前放弃：某一组过了它的最晚底注还一个都没中 */
    for(let g=0;g<groups.length;g++) if(a>=gmax[g]&&!groupOk(g)) return false;
  }
  for(let g=0;g<groups.length;g++) if(!groupOk(g)) return false;
  return true;
}

/* 对外：先快速排除，看着有戏再用完整版确认 */
function matchFast(seed,plan){
  if(!fastScan(seed,plan))return null;
  return matchSeed(seed,plan.groups,plan.slots,plan.maxAnte,plan.withPacks,plan.editionNeeds);
}
</script>

"use strict";

 3: ["DNA","Vagabond","Baron","Obelisk","Baseball Card","Ancient Joker","Campfire","Blueprint","Wee Joker","Hit the Road","The Duo","The Trio","The Family","The Order","The Tribe","Stuntman","Invisible Joker","Brainstorm","Drivers License","Burnt Joker"],
 4: ["Canio","Triboulet","Yorick","Chicot","Perkeo"]

/* ===== 引擎（32 位手写版，逻辑与对拍通过的 BigInt 版完全一致） ===== */
function pseudohash(str){
  let num=1;
  for(let i=str.length;i>=1;i--)
    num=((1.1239285023/num)*str.charCodeAt(i-1)*Math.PI+Math.PI*i)%1;
  return num;
}
/* 与 parseFloat(x.toFixed(13)) 逐位相同：x*1e13 的误差不到 0.001，
   只有小数部分贴着 .5 时取整方向才可能不同，那时退回字符串版 */
function round13(x){
  const y=x*1e13, f=y-Math.floor(y);
  if(f>0.49&&f<0.51) return parseFloat(x.toFixed(13));

const _b=new ArrayBuffer(8),_f=new Float64Array(_b),_u=new Uint32Array(_b);

class LuaRandom{

  /* 四路 Tausworthe 按常数展开，64 位拆成 hi/lo 两个 32 位 */
  step(){
    let zh,zl,ah,al,bh,bl,h,l;

    h=zh;l=zl;
    /* 第 1 路：k=58 q=19 s=28 */
    zh=this.h1;zl=this.l1;
    ah=((zh<<19)|(zl>>>13))^zh;al=(zl<<19)^zl;
    al=(al>>>30)|(ah<<2);ah=ah>>>30;
    bl=zl&4294967232;
    bh=(zh<<28)|(bl>>>4);bl=bl<<28;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h1=zh;this.l1=zl;
    h^=zh;l^=zl;
    /* 第 2 路：k=55 q=24 s=7 */
    zh=this.h2;zl=this.l2;
    ah=((zh<<24)|(zl>>>8))^zh;al=(zl<<24)^zl;
    al=ah>>>16;ah=0;
    bl=zl&4294966784;
    bh=(zh<<7)|(bl>>>25);bl=bl<<7;
    zh=(ah^bh)>>>0;zl=(al^bl)>>>0;this.h2=zh;this.l2=zl;
    h^=zh;l^=zl;
    /* 第 3 路：k=47 q=21 s=8 */
    zh=this.h3;zl=this.l3;
    ah=((zh<<21)|(zl>>>11))^zh;al=(zl<<21)^zl;

    bh=(zh<<8)|(bl>>>24);bl=bl<<8;

    _f[0]=d;this.h1=_u[1];this.l1=_u[0];if(this.l1<64)this.l1=(this.l1+64)>>>0;
    d=d*3.14159265358979323846+2.7182818284590452354;
    _f[0]=d;this.h2=_u[1];this.l2=_u[0];if(this.l2<512)this.l2=(this.l2+512)>>>0;

/* key 跟种子无关：每个 key 发一个固定编号，随机状态按编号存进数组。
   同一个 key 不管走字符串还是走编号，读写的都是同一格，结果不变 */
const KEY_ID=new Map(),KEY_STR=[],KEY_RES=[];
function kid(str){
  let id=KEY_ID.get(str);
  if(id===undefined){id=KEY_STR.length;KEY_ID.set(str,id);KEY_STR.push(str);KEY_RES.push(null);}
  return id;
}
function resampleId(id,n){
  let r=KEY_RES[id];if(!r)r=KEY_RES[id]=[];
  let x=r[n];if(x===undefined)x=r[n]=kid(KEY_STR[id]+"_resample"+n);

class Run{
  constructor(s){
    this.rng=new LuaRandom();
    this.sv=new Float64Array(256);this.sg=new Float64Array(256);   /* 状态值 / 属于第几次 reset */
    this.hv=new Float64Array(64);this.hg=new Float64Array(64);     /* 种子那段哈希，按 key 长度缓存 */
    this.g=0;this.reset(s);
  }
  reset(s){this.seedStr=s;this.hashed=pseudohash(s);this.g++;return this;}
  /* pseudohash(key+seed) 从末尾往前算，所以种子那几个字符先算，
     中间结果只跟 key 的长度有关，同一个种子里可以共用 */
  seedPart(klen){
    if(klen>=this.hv.length){const n=klen*2+1;const a=new Float64Array(n),b=new Float64Array(n);
      a.set(this.hv);b.set(this.hg);this.hv=a;this.hg=b;}
    if(this.hg[klen]===this.g)return this.hv[klen];
    const s=this.seedStr,L=klen+s.length;let num=1;
    for(let i=L;i>klen;i--)num=((1.1239285023/num)*s.charCodeAt(i-klen-1)*Math.PI+Math.PI*i)%1;
    this.hv[klen]=num;this.hg[klen]=this.g;return num;
  }
  pseudoseedId(id){
    if(id>=this.sv.length){let n=this.sv.length;while(n<=id)n*=2;
      const a=new Float64Array(n),b=new Float64Array(n);a.set(this.sv);b.set(this.sg);this.sv=a;this.sg=b;}
    let v;
    if(this.sg[id]===this.g)v=this.sv[id];
    else{
      const k=KEY_STR[id];let num=this.seedPart(k.length);
      for(let i=k.length;i>=1;i--)num=((1.1239285023/num)*k.charCodeAt(i-1)*Math.PI+Math.PI*i)%1;
      v=num;
    }
    v=Math.abs(round13((2.134453429141+v*1.72431234)%1));
    this.sv[id]=v;this.sg[id]=this.g;
    return (v+this.hashed)/2;
  }
  pseudoseed(key){return this.pseudoseedId(kid(key));}
  randId(id){this.rng.seed(this.pseudoseedId(id));return this.rng.double();}
  rand(key){return this.randId(kid(key));}
  pick(key,list){this.rng.seed(this.pseudoseed(key));return list[this.rng.int(list.length)-1];}
}

/* ========== 商店 ========== */
const EDITIONS=[[0.997,"负片"],[0.994,"多彩"],[0.98,"全息"],[0.96,"闪箔"]];

function jokerEdition(run,src,ante){
  const p=run.rand("edi"+src+ante);

  return null;
}

/* 开局就锁住的牌：源码里它们在池子里占着位子（UNAVAILABLE），抽到了要重抽 */
/* 金票/钢铁/石头/幸运猫/玻璃 要牌组里有对应增强牌；卡文迪什要大麦克香蕉灭绝过 */
const GATED_JOKERS=new Set(["Golden Ticket","Steel Joker","Stone Joker","Lucky Cat","Glass Joker","Cavendish"]);
/* 实战里条件达成后就解锁：传进来的是已解锁的小丑名字。
   大麦克香蕉灭绝之后卡文迪什解锁，大麦克香蕉自己反而再也不会出现 */
const GATE_BASE=["Golden Ticket","Steel Joker","Stone Joker","Lucky Cat","Glass Joker","Cavendish"];
function setUnlocks(u){
  u=u||[];GATED_JOKERS.clear();
  for(const j of GATE_BASE) if(!u.includes(j)) GATED_JOKERS.add(j);
  if(u.includes("Cavendish")) GATED_JOKERS.add("Gros Michel");

/* 行星X/谷神星/阋神星 要先打出过对应牌型 */
const GATED_PLANETS=new Set(["Planet X","Ceres","Eris"]);

/* 商店第 n 个位置卖什么 */
function shopSlot(run,ante){
  const t=run.rand("cdt"+ante)*28;
  /* 商店的消耗牌不 soulable（create_card 第六个参数没传），永远不会翻灵魂牌 */
  if(t>=20) return {type:t<24?"塔罗牌":"星球牌"};
  const r=run.rand("rarity"+ante+"sho");
  const rarity=r>0.95?3:(r>0.7?2:1);
  const name=run.choice("Joker"+rarity+"sho"+ante,POOLS[rarity],GATED_JOKERS);
  return {type:"joker",name,rarity,edition:jokerEdition(run,"sho",ante)};
}


/* ===== 消耗牌池 ===== */
const TAROTS=["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Justice","The Hermit","The Wheel of Fortune","Strength","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
const PLANETS=["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto","Planet X","Ceres","Eris"];
const SPECTRALS=["Familiar","Grim","Incantation","Talisman","Aura","Wraith","Sigil","Ouija","Ectoplasm","Immolate","Ankh","Deja Vu","Hex","Trance","Medium","Cryptid","RETRY","RETRY"];

/* 卡包权重（第一项是"这个位子没有包"） */
const PACKS=[["RETRY",22.42],["Arcana Pack",4],["Jumbo Arcana Pack",2],["Mega Arcana Pack",0.5],
["Celestial Pack",4],["Jumbo Celestial Pack",2],["Mega Celestial Pack",0.5],
["Standard Pack",4],["Jumbo Standard Pack",2],["Mega Standard Pack",0.5],
["Buffoon Pack",1.2],["Jumbo Buffoon Pack",0.6],["Mega Buffoon Pack",0.15],
["Spectral Pack",0.6],["Jumbo Spectral Pack",0.3],["Mega Spectral Pack",0.07]];

/* 加权抽签：拿第一项的权重当总量，往后累加 */
Run.prototype.weighted=function(key,items){return this.weightedId(kid(key),items);};
Run.prototype.weightedId=function(id,items){
  this.rng.seed(this.pseudoseedId(id));
  const poll=this.rng.double()*items[0][1];
  let idx=1,w=0;
  while(w<poll){w+=items[idx][1];idx++;}
  return items[idx-1][0];
};

/* 带锁的抽取：抽到锁上的就 _resample2、_resample3 重抽 */
Run.prototype.choice=function(key,items,locked){return this.choiceId(kid(key),items,locked);};
Run.prototype.choiceId=function(id,items,locked){
  this.rng.seed(this.pseudoseedId(id));
  let it=items[this.rng.int(items.length)-1];
  if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  let n=2;
  while(n<=1000){
    this.rng.seed(this.pseudoseedId(resampleId(id,n)));
    it=items[this.rng.int(items.length)-1];
    n++;
    if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  }
  return it;
};

/* 包的种类 → 里面几张、能选几张 */
const _PINFO=Object.create(null);
function packInfo(p){return _PINFO[p]||(_PINFO[p]=packInfo0(p));}
function packInfo0(p){
  /* 小丑包和幻灵包共用小尺寸：普通 2 张、大 4 张、超大 4 张选 2 */
  const small=p.includes("Buffoon")||p.includes("Spectral");
  if(p.startsWith("Mega "))  return {kind:p.slice(5), size:small?4:5, pick:2};
  if(p.startsWith("Jumbo ")) return {kind:p.slice(6), size:small?4:5, pick:1};
  return {kind:p, size:small?2:3, pick:1};
}

const PACK_CN={"Arcana Pack":"奇术包","Celestial Pack":"天体包","Standard Pack":"标准包",
               "Buffoon Pack":"小丑包","Spectral Pack":"幻灵包"};
function packName(p){
  const i=packInfo(p);
  return (p.startsWith("Mega ")?"超大":p.startsWith("Jumbo ")?"大":"")+(PACK_CN[i.kind]||i.kind);
}

/* 包里装了什么 */
function openPack(run,p,ante){
  const {kind,size}=packInfo(p);
  const locked=new Set(kind==="Celestial Pack"?GATED_PLANETS:GATED_JOKERS),out=[];
  let soulDone=false,holeDone=false;
  for(let i=0;i<size;i++){
    let c;
    if(kind==="Buffoon Pack"){
      const r=run.rand("rarity"+ante+"buf");
      const rarity=r>0.95?3:(r>0.7?2:1);
      const name=run.choice("Joker"+rarity+"buf"+ante,POOLS[rarity],locked);
      c={type:"joker",name,rarity,edition:jokerEdition(run,"buf",ante)};
    } else if(kind==="Arcana Pack"){
      /* 同一个包里灵魂牌只出一张，出过之后连掷都不掷了 */
      if(!soulDone&&run.rand("soul_Tarot"+ante)>0.997){c={type:"soul"};soulDone=true;}
      else c={type:"tarot",name:run.choice("Tarot"+"ar1"+ante,TAROTS,locked)};
    } else if(kind==="Spectral Pack"){
      /* 源码里这是两个独立的 if，两次都要掷，后者盖过前者 */
      const isSoul=!soulDone&&run.rand("soul_Spectral"+ante)>0.997;
      const isHole=!holeDone&&run.rand("soul_Spectral"+ante)>0.997;
      if(isHole){c={type:"spectral",name:"Black Hole"};holeDone=true;}
      else if(isSoul){c={type:"soul"};soulDone=true;}
      else c={type:"spectral",name:run.choice("Spectral"+"spe"+ante,SPECTRALS,locked)};
    } else if(kind==="Celestial Pack"){
      c={type:"planet",name:run.choice("Planet"+"pl1"+ante,PLANETS,locked)};
    } else { c={type:"card",name:"扑克牌"}; }   /* 标准包暂不细分 */
    if(c.type==="soul"){
      /* 灵魂牌造出的传奇走自己的通道：source 是 "sou" */
      c={type:"joker",name:run.choice("Joker4",POOLS[4]),rarity:4,
         edition:jokerEdition(run,"sou",ante),soul:true};
    }
    if(c.name)locked.add(c.name);
    out.push(c);
  }
  return out;
}

/* 打完 Boss 底注就 +1，那次商店算下一底注头上：
   所以底注 1 只有小盲、大盲两次商店（4 个包），之后每底注 3 次（6 个包） */
function antePacks(run,ante,state){
  const res=[];
  const n=(ante===1)?4:6;
  for(let i=0;i<n;i++){
    let p;
    if(ante<=2&&!state.firstPack){ state.firstPack=true; p="Buffoon Pack"; }
    else p=run.weighted("shop_pack"+ante,PACKS);
    if(p==="RETRY")continue;
    res.push({pack:p,cards:openPack(run,p,ante)});
  }
  return res;
}

const _shared=new Run("AAAAAAAA");
function scanSeed(seed,antes,slots,withPacks){
  const run=_shared.reset(seed);
  const found=[];const st={};
  for(let a=1;a<=antes;a++){
    for(let s=1;s<=slots;s++){
      const it=shopSlot(run,a);
      if(it.type==="joker")found.push({name:it.name,ante:a,slot:s,
        edition:it.edition,soul:it.soul,from:"商店第 "+s+" 位"});
    }
    if(withPacks){
      for(const p of antePacks(run,a,st))
        for(const c of p.cards)
          if(c.type==="joker")found.push({name:c.name,ante:a,slot:0,
            edition:c.edition,soul:c.soul,from:packName(p.pack)});
    }
  }
  return found;
}
const CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
const TOTAL=Math.pow(35,8);
function seedFromIndex(n){let s="";for(let i=0;i<8;i++){s=CHARS[n%35]+s;n=Math.floor(n/35);}return s;}
function indexFromSeed(str){
  const s=str.toUpperCase().padStart(8,"A");let n=0;
  for(let i=0;i<8;i++){const p=CHARS.indexOf(s[i]);n=n*35+(p<0?0:p);}
  return n;
}
function matchSeed(seed,groups,slots,maxAnte,withPacks,editionNeeds){
  const got=scanSeed(seed,maxAnte,slots,withPacks);
  const out=new Array(groups.length);
  const used=new Set();
  const needed=editionNeeds||{};
  const counts={};
  const needKeys=Object.keys(needed).filter(k=>needed[k]>0);
  const search=i=>{
    if(i===groups.length)
      return needKeys.every(k=>(counts[k]||0)>=needed[k]);
    const deficit=needKeys.reduce((n,k)=>n+Math.max(0,needed[k]-(counts[k]||0)),0);
    if(deficit>groups.length-i)return false;
    const candidates=[];const seen=new Set();
    for(const w of groups[i]) for(let gi=0;gi<got.length;gi++){
      const g=got[gi];
      if(!seen.has(gi)&&!used.has(gi)&&g.name===w.name&&g.ante<=w.ante&&(!w.ed||g.edition===w.ed)){
        seen.add(gi);candidates.push([gi,g]);
      }
    }
    candidates.sort((a,b)=>Math.max(0,(needed[b[1].edition]||0)-(counts[b[1].edition]||0))-
      Math.max(0,(needed[a[1].edition]||0)-(counts[a[1].edition]||0)));
    for(const [gi,g] of candidates){
      used.add(gi);out[i]=g;
      if(g.edition)counts[g.edition]=(counts[g.edition]||0)+1;
      if(search(i+1))return true;
      if(g.edition)counts[g.edition]--;
      used.delete(gi);
    }
    return false;
  };
  return search(0)?out:null;
}

/* ===== 快速通道：只算条件用得上的东西，用来快速排除 ===== */
const RAR_OF={};
for(const r of [1,2,3,4]) for(const j of POOLS[r]) RAR_OF[j]=r;

function makePlan(groups,slots,maxAnte,withPacks,editionNeeds){
  const needRar=new Set();
  let needLeg=false;
  const allWants=[];
  for(const grp of groups) for(const w of grp){
    allWants.push(w);
    const r=RAR_OF[w.name];
    if(r===4)needLeg=true; else needRar.add(r);
  }
  const deadline={};
  for(const grp of groups){
    const maxA=Math.max(...grp.map(w=>w.ante));
    for(const w of grp) deadline[maxA]=(deadline[maxA]||[]);
  }
  const gmax=groups.map(g=>Math.max(...g.map(w=>w.ante)));
  /* 整组都是传奇的，可以在第一遍就判 */
  const legGroups=[];let legMax=0;
  groups.forEach((g,i)=>{
    if(g.every(w=>RAR_OF[w.name]===4))legGroups.push(i);
    for(const w of g) if(RAR_OF[w.name]===4) legMax=Math.max(legMax,w.ante);
  });
  return {needRar,needLeg,groups,gmax,legGroups,legMax,deadline,slots,maxAnte,withPacks,editionNeeds};
}

/* 每个底注用到的 key 编号，第一次用到时登记 */
const _FK=[];
function fk(a){
  let k=_FK[a];if(k)return k;
  return _FK[a]={cdt:kid("cdt"+a),rSho:kid("rarity"+a+"sho"),rBuf:kid("rarity"+a+"buf"),
    jSho:[0,kid("Joker1sho"+a),kid("Joker2sho"+a),kid("Joker3sho"+a)],
    jBuf:[0,kid("Joker1buf"+a),kid("Joker2buf"+a),kid("Joker3buf"+a)],
    pack:kid("shop_pack"+a),sT:kid("soul_Tarot"+a),sS:kid("soul_Spectral"+a)};
}
const K_J4=kid("Joker4");

/* 返回 true = 这个种子有戏，值得完整算一遍。
   分两遍：先只看灵魂牌（便宜，而且大多数种子在这里就被淘汰），再看普通到稀有小丑。
   每条随机流只认自己的 key，不同 key 谁先算谁后算不影响结果；
   两遍都要用的卡包种类只掷一次，存起来给第二遍用。 */
const _PK=[];
function fastScan(seed,plan){
  const run=_shared.reset(seed);
  const found=new Map();   /* 名字 → 最早出现的底注 */
  const {needRar,needLeg,slots,maxAnte,withPacks,groups,gmax,legGroups,legMax}=plan;
  let packDone=0;
  const packsOf=a=>{       /* 第 a 底注的卡包，按底注顺序掷，掷过就记住 */
    while(packDone<a){
      const b=++packDone,K=fk(b),arr=_PK[b]||(_PK[b]=[]);arr.length=0;
      for(let i=0,np=(b===1?4:6);i<np;i++)
        arr.push(b===1&&i===0?"Buffoon Pack":run.weightedId(K.pack,PACKS));
    }
    return _PK[a];
  };
  const groupOk=g=>{
    for(const w of groups[g]){const fa=found.get(w.name);if(fa!==undefined&&fa<=w.ante)return true;}
    return false;
  };

  /* 第一遍：灵魂牌 → 传奇 */
  if(needLeg&&withPacks){
    for(let a=1;a<=legMax;a++){
      const K=fk(a);
      for(const p of packsOf(a)){
        const info=packInfo(p);
        if(info.kind==="Arcana Pack"){
          for(let k=0;k<info.size;k++)
            if(run.randId(K.sT)>0.997){
              const n=run.choiceId(K_J4,POOLS[4]);
              if(!found.has(n))found.set(n,a);
              break;
            }
        } else if(info.kind==="Spectral Pack"){
          let sd=false,hd=false;
          for(let k=0;k<info.size;k++){
            const isSoul=!sd&&run.randId(K.sS)>0.997;
            const isHole=!hd&&run.randId(K.sS)>0.997;
            if(isHole)hd=true;
            else if(isSoul){sd=true;const n=run.choiceId(K_J4,POOLS[4]);if(!found.has(n))found.set(n,a);}
          }
        }
      }
      /* 纯传奇的组过了期限还没中，直接扔 */
      for(const g of legGroups) if(a>=gmax[g]&&!groupOk(g)) return false;
    }
  }
  for(const g of legGroups) if(!groupOk(g)) return false;

  /* 第二遍：商店和小丑包里的普通/罕见/稀有 */
  for(let a=1;a<=maxAnte;a++){
    if(needRar.size){
      const K=fk(a);
      for(let s=1;s<=slots;s++){
        const t=run.randId(K.cdt)*28;
        if(t<20){
          const r=run.randId(K.rSho);
          const rar=r>0.95?3:(r>0.7?2:1);
          if(needRar.has(rar)){
            const n=run.choiceId(K.jSho[rar],POOLS[rar],GATED_JOKERS);
            if(!found.has(n))found.set(n,a);
          }
        }                                         /* 商店的塔罗/星球不会翻灵魂牌 */
      }
      if(withPacks){
        let locked=null;
        for(const p of packsOf(a)){
          const info=packInfo(p);
          if(info.kind!=="Buffoon Pack")continue;
          locked=new Set(GATED_JOKERS);
          for(let k=0;k<info.size;k++){
            const r=run.randId(K.rBuf);
            const rar=r>0.95?3:(r>0.7?2:1);
            const n=run.choiceId(K.jBuf[rar],POOLS[rar],locked);
            locked.add(n);
            if(needRar.has(rar)&&!found.has(n))found.set(n,a);
          }
        }
      }
    }
    /* 提前放弃：某一组过了它的最晚底注还一个都没中 */
    for(let g=0;g<groups.length;g++) if(a>=gmax[g]&&!groupOk(g)) return false;
  }
  for(let g=0;g<groups.length;g++) if(!groupOk(g)) return false;
  return true;
}

/* 对外：先快速排除，看着有戏再用完整版确认 */
function matchFast(seed,plan){
  if(!fastScan(seed,plan))return null;
  return matchSeed(seed,plan.groups,plan.slots,plan.maxAnte,plan.withPacks,plan.editionNeeds);
}

/* ---- 多线程 ---- */
const WORKER_SRC = document.getElementById('engine-src').textContent + `
onmessage = function(e){
  var d=e.data, hits=[];
  setUnlocks(d.unlocks);
  var plan=makePlan(d.groups,d.slots,d.maxAnte,d.withPacks,d.editionNeeds);
  for(var i=0;i<d.count;i++){
    var seed=seedFromIndex(d.start+i);
    var m=matchFast(seed,plan);
    if(m) hits.push({seed:seed,where:m});
  }
  postMessage({tried:d.count,hits:hits});
};`;

let pool=[],running=false;
function makeWorkers(){
  const n=Math.min(navigator.hardwareConcurrency||4,8);
  const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"}));
  const ws=[];
  for(let i=0;i<n;i++){ try{ ws.push(new Worker(url)); }catch(err){ break; } }
  return ws;
}

$("stop").onclick=()=>{running=false;};

$("go").onclick=()=>{
  if(running)return;
  const groups=[...document.querySelectorAll("#wants .wantgroup")].map(grp=>
    [...grp.querySelectorAll(".want")].map(d=>({
      name:d.querySelector(".j").value,
      ed:d.querySelector(".e").value,
      ante:parseInt(d.querySelector(".ant").value,10)||8
    }))
  ).filter(g=>g.length);
  if(!groups.length)return;
  const editionNeeds=readEditionNeeds();
  const editionNeedTotal=Object.values(editionNeeds).reduce((a,b)=>a+b,0);
  if(editionNeedTotal>groups.length){
    $("stat").textContent="组合版本数量不能超过条件数量（每张小丑最多只有一个版本）。";
    return;
  }
  const slots=parseInt($("slots").value,10)||6;
  const target=Math.max(1,parseInt($("found").value,10)||5);
  const maxAnte=Math.max(...groups.flat().map(w=>w.ante));
  const withPacks=$("packs").checked;
  setUnlocks(readUnlocks());
  const typed=$("from").value.trim();
  let cursor = typed ? indexFromSeed(typed) : Math.floor(Math.random()*TOTAL);

  running=true;$("stop").style.display="block";$("hits").innerHTML="";allHits=[];
  let tried=0,hits=0;const t0=performance.now();
  const CHUNK=8000;

  const show=()=>{
    const sec=(performance.now()-t0)/1000;
    $("stat").innerHTML="已试 <b>"+tried.toLocaleString()+"</b> 个 ・ "+
      Math.round(tried/sec).toLocaleString()+" 个/秒 ・ 命中 <b>"+hits+"</b><br>"+
      "数到这里了：<b>"+seedFromIndex(cursor)+"</b>　（下次填它就能接着搜）";
  };
  const report=(seed,where)=>{
    hits++;
    const txt=where.map(g=>jokerChip(g.name,26)+" "+jname(g.name)+" — 底注 "+g.ante+
      " ・ "+g.from+(g.edition?' <span class="ed">'+g.edition+"</span>":"")+
      (g.soul?" ✦灵魂牌":"")).join("<br>");
    $("hits").insertAdjacentHTML("afterbegin",
      '<div class="hit"><button class="cp">复制</button>'+
      '<div class="seed">'+seed+'</div><div class="where">'+txt+"</div></div>");
    allHits.push({seed:seed,where:where});
    $("tools").style.display="flex";
  };
  const finish=()=>{
    running=false;$("stop").style.display="none";
    pool.forEach(w=>w.terminate());pool=[];
    if(!hits)$("hits").innerHTML="这一段里一个都没有。放宽底注，或者接着往下数。";
  };

  pool=makeWorkers();

  if(pool.length){                       /* 多线程 */
    $("stat").textContent="用了 "+pool.length+" 个核心，开搜…";
    pool.forEach(w=>{
      const feed=()=>{
        if(!running||hits>=target){ if(pool.every(x=>x.idle))finish(); return; }
        w.idle=false;
        const start=cursor;cursor+=CHUNK;
        w.postMessage({start,count:CHUNK,groups,slots,maxAnte,withPacks,editionNeeds,unlocks:readUnlocks()});
      };
      w.onmessage=ev=>{
        tried+=ev.data.tried;
        ev.data.hits.forEach(h=>{ if(hits<target)report(h.seed,h.where); });
        show();
        w.idle=true;
        if(running&&hits<target)feed(); else finish();
      };
      feed();
    });
  } else {                               /* 退回单线程 */
    (async()=>{
      $("stat").textContent="这个浏览器不让开多线程，用单核跑…";
      while(running&&hits<target){
        const plan=makePlan(groups,slots,maxAnte,withPacks,editionNeeds);
        for(let n=0;n<3000&&running&&hits<target;n++){
          const seed=seedFromIndex(cursor++);tried++;
          const m=matchFast(seed,plan);
          if(m)report(seed,m);
        }
        show();
        await new Promise(r=>setTimeout(r));
      }
      finish();
    })();
  }
};

/* ===== 复制 / 导出 ===== */
let allHits=[];
function copyText(t,btn){
  const done=()=>{ if(btn){const o=btn.textContent;btn.textContent="已复制";setTimeout(()=>btn.textContent=o,800);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));
  } else fallback(t,done);
}
function fallback(t,cb){
  const ta=document.createElement("textarea");
  ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");cb();}catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener("click",e=>{
  const cp=e.target.closest(".cp");
  if(cp){
    const seed=cp.parentElement.querySelector(".seed").textContent.trim();
    copyText(seed,cp);
    return;
  }
  const sd=e.target.closest(".seed");
  if(sd&&!e.target.closest(".cp")){
    const t=sd.textContent.trim();
    copyText(t);
    const o=sd.textContent;sd.textContent="已复制";
    setTimeout(()=>{sd.textContent=o;},700);
  }
});

/* ===== 概率实测 ===== */
function describeGroups(groups){
  return groups.map(g=>{
    const names=g.map(w=>jname(w.name)+(w.ed?"("+w.ed+")":"")).join(" 或 ");
    const a=Math.max(...g.map(w=>w.ante));
    return names+" ≤底注"+a;
  }).join(" ＋ ");
}
function readGroups(){
  return [...document.querySelectorAll("#wants .wantgroup")].map(grp=>
    [...grp.querySelectorAll(".want")].map(d=>({
      name:d.querySelector(".j").value,
      ed:d.querySelector(".e").value,
      ante:parseInt(d.querySelector(".ant").value,10)||8
    }))
  ).filter(g=>g.length);
}
function readEditionNeeds(){
  const fields={"负片":"need-neg","多彩":"need-poly","全息":"need-holo","闪箔":"need-foil"};
  const out={};
  for(const [edition,id] of Object.entries(fields)){
    const n=Math.max(0,parseInt($(id).value,10)||0);
    if(n)out[edition]=n;
  }
  return out;
}
function describeEditionNeeds(needs){
  const parts=Object.entries(needs||{}).filter(([,n])=>n>0).map(([ed,n])=>ed+"至少 "+n+" 张");
  return parts.length?"；组合版本："+parts.join("、"):"";
}
function fmtTime(s){
  if(s<1)return "不到 1 秒";
  if(s<60)return Math.round(s)+" 秒";
  if(s<3600)return Math.round(s/60)+" 分钟";
  if(s<86400)return (s/3600).toFixed(1)+" 小时";
  return (s/86400).toFixed(1)+" 天";
}

/* ===== 概率粗估（公式，瞬时） ===== */
const ED_P={"":1,"负片":0.003,"多彩":0.003,"全息":0.014,"闪箔":0.02};
const RAR_P={1:0.70,2:0.25,3:0.05};
const PACK_TOTAL=22.42;
function packP(name){
  const it=PACKS.find(x=>x[0]===name);
  return it?it[1]/PACK_TOTAL:0;
}
/* 一张小丑在某个底注里出现的期望次数 */
function lambdaPerAnte(w,ante,slots,withPacks){
  const rar=RAR_OF[w.name];
  const edp=ED_P[w.ed]||1;
  let lam=0;
  if(rar===4){
    /* 传奇只从奇术包 / 幻灵包的灵魂牌来 */
    if(!withPacks)return 0;
    const nPacks=(ante===1)?4:6;
    const arc=[["Arcana Pack",3],["Jumbo Arcana Pack",5],["Mega Arcana Pack",5]];
    const spe=[["Spectral Pack",2],["Jumbo Spectral Pack",4],["Mega Spectral Pack",4]];
    let soulPerPack=0;
    for(const [n,sz] of arc.concat(spe))
      soulPerPack += packP(n)*(1-Math.pow(1-0.003,sz));
    lam = nPacks*soulPerPack*(1/5)*edp;
  }else{
    const pool=POOLS[rar].length;
    /* 商店 */
    lam += slots*(20/28)*RAR_P[rar]*(1/pool)*edp;
    /* 小丑包 */
    if(withPacks){
      const nPacks=(ante===1)?4:6;
      let cards=0;
      for(const [n,sz] of [["Buffoon Pack",2],["Jumbo Buffoon Pack",4],["Mega Buffoon Pack",4]])
        cards += packP(n)*sz;
      if(ante<=2)cards+=2/nPacks;   /* 开局那个必定的小丑包 */
      lam += nPacks*cards*RAR_P[rar]*(1/pool)*edp;
    }
  }
  return lam;
}
function groupLambda(grp,slots,withPacks){
  let lam=0;
  for(const w of grp)
    for(let a=1;a<=w.ante;a++)
      lam += lambdaPerAnte(w,a,slots,withPacks);
  return lam;
}
function sameGroup(a,b){
  if(a.length!==b.length)return false;
  const key=g=>g.map(w=>w.name+"|"+w.ed+"|"+w.ante).sort().join(",");
  return key(a)===key(b);
}
function editionNeedProbability(groups,slots,withPacks,needs){
  const keys=Object.keys(needs||{}).filter(k=>needs[k]>0);
  if(!keys.length)return 1;
  const editionP={"":0.96,"负片":0.003,"多彩":0.003,"全息":0.014,"闪箔":0.02};
  let states=new Map([[keys.map(()=>0).join(","),1]]);
  for(const grp of groups){
    const mix={"":0,"负片":0,"多彩":0,"全息":0,"闪箔":0};
    for(const w of grp){
      let base=0;
      const plain={name:w.name,ed:"",ante:w.ante};
      for(let a=1;a<=w.ante;a++)base+=lambdaPerAnte(plain,a,slots,withPacks);
      if(w.ed)mix[w.ed]+=base*(ED_P[w.ed]||0);
      else for(const [ed,p] of Object.entries(editionP))mix[ed]+=base*p;
    }
    const total=Object.values(mix).reduce((a,b)=>a+b,0);
    if(total<=0)return 0;
    const next=new Map();
    for(const [state,p0] of states){
      const counts=state.split(",").map(Number);
      for(const [ed,weight] of Object.entries(mix)){
        if(weight<=0)continue;
        const nc=counts.slice();const k=keys.indexOf(ed);
        if(k>=0)nc[k]=Math.min(needs[ed],nc[k]+1);
        const id=nc.join(",");next.set(id,(next.get(id)||0)+p0*weight/total);
      }
    }
    states=next;
  }
  return states.get(keys.map(k=>needs[k]).join(","))||0;
}
function estimate(groups,slots,withPacks,editionNeeds){
  /* 把完全相同的组合并，用泊松算"至少 k 个" */
  const buckets=[];
  for(const g of groups){
    const b=buckets.find(x=>sameGroup(x.grp,g));
    if(b)b.k++; else buckets.push({grp:g,k:1});
  }
  let p=1;
  for(const b of buckets){
    const lam=groupLambda(b.grp,slots,withPacks);
    if(lam<=0)return 0;
    /* P(至少 k 次)，泊松 */
    let tail=1,term=Math.exp(-lam);
    for(let j=0;j<b.k;j++){ tail-=term; term=term*lam/(j+1); }
    p *= Math.max(tail,0);
  }
  return p*editionNeedProbability(groups,slots,withPacks,editionNeeds);
}

$("est").onclick=()=>{
  const groups=readGroups();
  if(!groups.length)return;
  const editionNeeds=readEditionNeeds();
  if(Object.values(editionNeeds).reduce((a,b)=>a+b,0)>groups.length){
    $("odds").style.display="block";
    $("odds").innerHTML='<span class="lv lv-hard">搜不到</span>组合版本数量不能超过条件数量。';
    return;
  }
  const slots=parseInt($("slots").value,10)||0;
  const withPacks=$("packs").checked;
  setUnlocks(readUnlocks());
  const box=$("odds");
  box.style.display="block";

  const p=estimate(groups,slots,withPacks,editionNeeds);
  const cores=Math.min(navigator.hardwareConcurrency||4,8);
  const speed=14000*cores*0.85;   /* 每核大概 1.4 万/秒 */

  let lv,lvName,txt;
  if(p<=0||!isFinite(p)){
    box.innerHTML='<span class="lv lv-hard">搜不到</span>这个条件不可能满足<br>'+
      '<span style="color:var(--dim)">传奇小丑只从卡包的灵魂牌出，记得勾上「连卡包里的一起搜」。</span>';
    return;
  }
  const one=Math.round(1/p);
  const sec=one/speed;
  if(sec<5){lv="lv-easy";lvName="轻松";}
  else if(sec<300){lv="lv-mid";lvName="要等等";}
  else {lv="lv-hard";lvName="硬骨头";}

  txt="大约每 <span class=\"big\">"+one.toLocaleString()+"</span> 个种子出一个<br>";
  if(sec>1800)txt+='<br><span style="color:var(--dim)">太久的话，可以放宽条件，或用「+ 或者」多加几张备选。</span>';

  box.innerHTML='<span class="lv '+lv+'">'+lvName+'</span>'+describeGroups(groups)+describeEditionNeeds(editionNeeds)+
    '<div style="margin-top:8px">'+txt+'</div>'+
    '<div style="margin-top:6px;color:var(--dim);font-size:13px">粗略估算，实际用时一般远小于估计</div>';
};

        ? jname(c.name)+(c.soul?"✦":"")+(c.edition?"・"+c.edition:"")

      html+='<div style="padding-left:14px"><span class="o">'+packName(p.pack)+
            "（"+packInfo(p.pack).size+" 选 "+packInfo(p.pack).pick+"）：</span>"+cs+"</div>";
    }
  }
  $("pv").innerHTML=html;
};
